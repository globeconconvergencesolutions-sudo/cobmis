# Every published port is bound to 127.0.0.1. Nothing listens on a public interface.
name: cob-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cob}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-cob_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      # The app's login roles are created by `python -m scripts.migrate`, not by an init
      # script: nothing from the working tree is mounted into this container.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: run Ollama in Docker instead of natively (`docker compose --profile ollama up`).
  # Native Ollama is usually simpler for GPU access; either way it must stay on 127.0.0.1.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment for NVIDIA GPUs (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
